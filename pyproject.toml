[project]
name = "torchure"
version = "0.1.0"
description = "a pure pytorch training stack for transformer llms"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="giyushino", email="allanzhang440@gmail.com" }]

requires-python = "==3.14.*"
keywords = ["pytorch", "training"]

dependencies = [
    "torch==2.14.1",
    "numpy==2.4.6",
    "tokenizers",
    # parquet sources (dataloader/sources.py)
    "pyarrow",
]


# torch comes from pytorch's cuda 13.2 index, not pypi's default build:
# cuda 13's cublas/cudnn are +22% tok/s on h100 over cuda 12 (0.6B ddp,
# 195k -> 238k; notes/TORCHTITAN_COMPARE.md), and b300s need cuda >= 13.1.
# needs nvidia driver >= 580.
# for an older driver, delete [tool.uv.sources] below and `uv lock`.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
# image-caption sources (a vlm's data): jpeg/png decoding
vision = ["pillow"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["torchure*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# defaults (E4/E7/E9 pycodestyle errors + F pyflakes) plus B bugbear, which
# catches real bugs (mutable defaults, raise NotImplemented, silent zips).
# ratchet more rules in over time; don't add formatting churn retroactively.
extend-select = ["B"]
